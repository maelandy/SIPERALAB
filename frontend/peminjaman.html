<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPERALAB - Form Peminjaman</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

  <header class="site-header">
    <a href="/" class="brand">SIPERALAB</a>
    <nav>
      <a href="/index.html">Beranda</a>
      <a href="/peralatan.html">Peralatan</a>
      <a href="/peminjaman.html">Peminjaman</a>
    </nav>
  </header>

  <main>
    <h2>Formulir Peminjaman Peralatan</h2>
    <p>Silakan isi data diri dan detail peralatan yang ingin Anda pinjam bawah ini.</p>

    <form action="/peminjaman" method="POST">
      <div class="form-grid">

        <fieldset>
          <legend>Identitas Peminjam</legend>

          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

          <label for="nim">NIM</label>
          <input type="text" id="nim" name="nim" pattern="[0-9]{10}" placeholder="Contoh: 2023071001" required>
          <p class="hint">NIM harus berupa 10 digit angka.</p>

          <label for="email">Email Student</label>
          <input type="email" id="email" name="email" placeholder="nama@student.upj.ac.id" required>
        </fieldset>

        <fieldset>
          <legend>Detail Peminjaman</legend>

          <label for="peralatan">Peralatan yang Dipinjam</label>
          <select id="peralatan" name="peralatan" required>
            <option value="">-- Pilih Peralatan --</option>
            <option value="multimeter">Multimeter Digital</option>
            <option value="router">Router</option>
            <option value="kamera">Kamera</option>
          </select>

          <label for="durasi">Durasi Peminjaman (Hari)</label>
          <input type="number" id="durasi" name="durasi" min="1" max="7" value="1" required>
          <p class="hint">Maksimal peminjaman adalah 7 hari.</p>

          <label for="alasan">Alasan Peminjaman</label>
          <textarea id="alasan" name="alasan" rows="4" placeholder="Jelaskan kebutuhan peminjaman peralatan..." required></textarea>
        </fieldset>

      </div>

      <div class="form-actions">
        <button type="reset">Bersihkan</button>
        <button type="submit">Kirim pengajuan</button>
      </div>
    </form>
  </main>

  <footer>
    <p>Latihan praktikum Komputasi Berbasis Web.</p>
  </footer>

</body>
</html>
